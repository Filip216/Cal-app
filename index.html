<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth" class="auth-screen">
  <h1>Meal Tracker</h1>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login / Register</button>
</div>

<!-- MAIN APP -->
<div id="app" class="app hidden">

  <nav class="nav">
    <button onclick="showPage('meals')">Meals</button>
    <button onclick="showPage('today')">Today</button>
    <button onclick="showPage('stats')">Stats</button>
    <button class="danger" onclick="logout()">Logout</button>
  </nav>

  <!-- MEALS -->
  <section id="meals" class="page">
    <h2>My Meals</h2>

    <div class="add-meal">
      <input id="mealName" placeholder="Meal name">
      <input id="mealDesc" placeholder="Description">
      <input id="kcal" type="number" placeholder="kcal / 100g">
      <input id="protein" type="number" placeholder="Protein / 100g">
      <input id="carbs" type="number" placeholder="Carbs / 100g">
      <input id="fat" type="number" placeholder="Fat / 100g">
      <button onclick="addMeal()">Add Meal</button>
    </div>

    <div id="mealList"></div>
  </section>

  <!-- TODAY -->
  <section id="today" class="page hidden">
    <h2>Today</h2>

    <div id="todayTotals" class="totals-card"></div>
    <div id="todayEntries" class="today-list"></div>

    <button class="danger finish-btn" onclick="finishDay()">Finish Day</button>
  </section>

  <!-- STATS -->
  <section id="stats" class="page hidden">
    <h2>Weekly Stats</h2>
    <div id="statsContent"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
